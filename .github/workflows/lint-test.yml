name: Lint & test (reusable)

on:
  workflow_call:
    inputs:
      language:
        required: true
        type: string
      version:
        required: false
        type: string
        default: ""
      working_directory:
        required: false
        type: string
        default: .
      runner:
        required: false
        type: string
        default: ubuntu-latest
      run_pre_commit:
        required: false
        type: boolean
        default: true
      lint_command:
        required: false
        type: string
        default: ""
      test_command:
        required: false
        type: string
        default: ""
      package_manager:
        required: false
        type: string
        default: ""

jobs:
  pre-commit:
    if: inputs.run_pre_commit
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1

  python:
    if: inputs.language == 'python'
    runs-on: ${{ inputs.runner }}
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.version || '3.12' }}
      - uses: astral-sh/setup-uv@v10
        if: inputs.package_manager == 'uv'
        with:
          enable-cache: true
      - name: Install
        run: |
          set -euo pipefail
          if [ "${{ inputs.package_manager }}" = "uv" ]; then
            uv sync --frozen
          elif [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          elif [ -f pyproject.toml ]; then
            python -m pip install .
          fi
      - name: Lint
        run: ${{ inputs.lint_command || 'python -m ruff check .' }}
      - name: Test
        if: inputs.test_command != ''
        run: ${{ inputs.test_command }}

  node:
    if: inputs.language == 'node'
    runs-on: ${{ inputs.runner }}
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.version || '24' }}
          cache: ${{ inputs.package_manager || 'npm' }}
      - name: Install
        run: |
          set -euo pipefail
          case "${{ inputs.package_manager || 'npm' }}" in
            pnpm) corepack enable && pnpm install --frozen-lockfile ;;
            yarn) corepack enable && yarn install --immutable ;;
            *) if [ -f package-lock.json ]; then npm ci; else npm install; fi ;;
          esac
      - name: Lint
        run: ${{ inputs.lint_command || 'npm run lint --if-present' }}
      - name: Test
        run: ${{ inputs.test_command || 'npm test --if-present' }}

  go:
    if: inputs.language == 'go'
    runs-on: ${{ inputs.runner }}
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ inputs.version || '1.25' }}
          cache: true
      - name: Lint
        run: ${{ inputs.lint_command || 'go vet ./...' }}
      - name: Test
        run: ${{ inputs.test_command || 'go test ./...' }}

  java:
    if: inputs.language == 'java'
    runs-on: ${{ inputs.runner }}
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ inputs.version || '21' }}
          cache: ${{ inputs.package_manager || 'maven' }}
      - name: Build and test
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.test_command }}" ]; then
            ${{ inputs.test_command }}
          elif [ -f pom.xml ]; then
            ./mvnw --batch-mode verify || mvn --batch-mode verify
          else
            ./gradlew build
          fi
