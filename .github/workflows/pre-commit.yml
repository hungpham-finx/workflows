name: pre-commit (reusable)

on:
  workflow_call:
    inputs:
      python_version:
        required: false
        type: string
        default: "3.12"
      extra_args:
        required: false
        type: string
        default: "--all-files"

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python_version }}

      - uses: pre-commit/action@v3.0.1
        with:
          extra_args: ${{ inputs.extra_args }}
